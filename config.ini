# Lifetch Configuration
#
# Options come before the format line; unknown keys are ignored, and a known key
# with a bad value warns and keeps its default. Lines after the format line are
# always output text, so options added in later versions can never collide with
# your layout. Quotes keep leading/trailing spaces in values.
#   units = auto|b|k|m|g|t    size unit for memory and disks (default auto)
#   precision = 0..4          fraction digits (default 1)
#   sep.disk = <text>         joins the entries of {disks} (default " · ")
#   sep.gpu = <text>          joins the entries of {gpus} (default " · ")
#   var.<name> = <text>       your own text, printed by {@<name>}
#   color.<name> = <color>    your own color, used as {color.<name>}
#     color: r,g,b decimals, #rrggbb, or black/red/green/yellow/blue/magenta/
#     cyan/white. The first definition of a name wins; 8 vars and 8 colors max.
#
# Placeholders:
#   {user} {host} {shell} {term} {uptime} {pkgs} {session} {wm}
#   {distro} {distro_pretty} {kernel}
#   {cpu} {cpu_cores} {cpu_threads} {cpu_percent} {load}
#   {mem} {mem_used} {mem_total} {mem_percent}
#   {swap} {swap_used} {swap_total} {swap_percent}
#   {disk} {disk_used} {disk_total} {disk_percent}
#     one disk; pick by mount path, device or index: {disk(/home)}
#     {disk_used(/dev/sda1)} {disk(2)} - or plain {disk} for the first
#   {disks}   every disk joined with sep.disk
#   {gpu} {gpu_vram} {gpu_percent}   one GPU; {gpu(1)} picks by index
#   {gpus}    every GPU joined with sep.gpu
#
# What each family costs (this machine):
#   mem/swap ~14µs (one /proc/meminfo read)
#   disks    ~38µs (mount table + one statfs per disk)
#   cpu      ~14µs (+~29µs with {cpu_percent}: /proc/stat is expensive)
#   gpus     ~35µs, pkgs ~14µs, kernel ~0µs (free)
# Only the families your format mentions are read.
#
# Colors and styles: {red}text{/red}, {rgb(255,0,0)}text{/rgb}, {bold}text{/}
# Reset anything: {/}
#
# Your own words and colors:
#   var.label = ram:
#   color.accent = 180,142,173
# then in a format line: {@label} {color.accent}{mem}{/}

units = auto
precision = 1

format = {rgb(108,108,108)}[ {/}{rgb(212,212,212)}{user}{/}{rgb(108,108,108)}@{/}{rgb(212,212,212)}{host}{/} {rgb(108,108,108)}]{/}
{rgb(108,108,108)}[ {/}{rgb(212,212,212)}os {/}{bold}{italic}{rgb(180,142,173)}{distro}{/} {rgb(108,108,108)}/ {/}{rgb(212,212,212)}wm {/}{bold}{italic}{rgb(180,142,173)}{wm}{/} {rgb(108,108,108)}/ {/}{rgb(212,212,212)}{session}{/} {rgb(108,108,108)}]{/}
{rgb(108,108,108)}[ {/}{rgb(212,212,212)}term {/}{bold}{italic}{rgb(180,142,173)}{term}{/} {rgb(108,108,108)}/ {/}{rgb(212,212,212)}shell {/}{bold}{italic}{rgb(180,142,173)}{shell}{/} {rgb(108,108,108)}/ {/}{rgb(212,212,212)}pkgs {/}{bold}{italic}{rgb(180,142,173)}{pkgs}{/} {rgb(108,108,108)}/ {/}{rgb(208,135,112)}up {uptime}{/} {rgb(108,108,108)}]{/}
{rgb(108,108,108)}[ {/}{rgb(212,212,212)}mem {/}{bold}{italic}{rgb(180,142,173)}{mem}{/} {rgb(108,108,108)}/ {/}{rgb(212,212,212)}swap {/}{bold}{italic}{rgb(180,142,173)}{swap}{/} {rgb(108,108,108)}/ {/}{rgb(208,135,112)}disk {disk}{/} {rgb(108,108,108)}]{/}
{rgb(108,108,108)}[ {/}{rgb(212,212,212)}cpu {/}{bold}{italic}{rgb(180,142,173)}{cpu}{/} {rgb(108,108,108)}]{/}
# show GPUs too (adds ~35µs): uncomment the next line
# {rgb(108,108,108)}[ {/}{rgb(212,212,212)}gpus {/}{bold}{italic}{rgb(208,135,112)}{gpus}{/} {rgb(108,108,108)}]{/}
