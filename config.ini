# Lifetch Configuration
#
# Format your output using these placeholders:
# {user}           - Current username
# {host}           - Hostname
# {shell}          - Current shell
# {term}           - Terminal name
# {uptime}         - System uptime
# {pkgs}           - Package count
# {session}        - Wayland/X11
# {wm}             - Window manager
# {distro}         - Linux distribution (short form)
# {distro_pretty}  - Linux distribution (pretty name)
#
# Colors and Styles:
# Basic colors: {red}text{/red}, {green}text{/green}, etc.
# RGB colors: {rgb(255,0,0)}text{/rgb}
# Styles: {bold}text{/bold}, {underline}text{/underline}, etc.
#
# Example formats:
# format = "{bold}{red}{user}@{host}{/red}{/bold} on {green}{term}{/green}"
# format = "{rgb(255,165,0)}os{/rgb}: {host} | {bold}shell{/bold}: {shell}"

format = {rgb(108,108,108)}[ {/}{rgb(212,212,212)}{user}{/}{rgb(108,108,108)}@{/}{rgb(212,212,212)}{host}{/} {rgb(108,108,108)}]{/}
{rgb(108,108,108)}[ {/}{rgb(212,212,212)}os {/}{bold}{italic}{rgb(180,142,173)}{distro}{/} {rgb(108,108,108)}/ {/}{rgb(212,212,212)}wm {/}{bold}{italic}{rgb(180,142,173)}{wm}{/} {rgb(108,108,108)}/ {/}{rgb(212,212,212)}{session}{/} {rgb(108,108,108)}]{/}
{rgb(108,108,108)}[ {/}{rgb(212,212,212)}term {/}{bold}{italic}{rgb(180,142,173)}{term}{/} {rgb(108,108,108)}/ {/}{rgb(212,212,212)}shell {/}{bold}{italic}{rgb(180,142,173)}{shell}{/} {rgb(108,108,108)}/ {/}{rgb(212,212,212)}pkgs {/}{bold}{italic}{rgb(180,142,173)}{pkgs}{/} {rgb(108,108,108)}/ {/}{rgb(208,135,112)}up {uptime}{/} {rgb(108,108,108)}]{/}
